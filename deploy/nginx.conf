server {
    listen 80;
    server_name _;
    client_max_body_size 160m;
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /game-data/ { alias /srv/public/game-data/; add_header Cache-Control "no-cache"; }
    location /game-assets/ { alias /srv/public/game-assets/; expires 1d; }
    location /datamine/shared/media/ { alias /srv/public/datamine/shared/media/; expires 1d; }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
