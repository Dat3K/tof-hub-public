name: Bug report
description: Something on the site or in the code does not work as expected.
labels: [bug, needs triage]
body:
  - type: input
    id: page
    attributes:
      label: Page, tool or command
      description: The affected URL, or the exporter/patcher command you ran.
      placeholder: https://tof.smilekritik.beer/tools/build/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live site
        - Self-hosted installation
        - Local development
        - ToF Exporter or branch patcher
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The dataset version shown in the header, exporter version or Git commit, if known.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows 11, Safari on iPhone, or the OS used by the tool
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For self-hosted installations, the relevant output of `docker compose logs`. Remove anything private.
      render: text
