name: Wrong or missing game data
description: A value, name, image or description that does not match the game.
labels: [bug, "area: game-data", needs triage]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://tof.smilekritik.beer/info/simulacra/
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Game edition
      options:
        - Global
        - MMO
        - Both
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Region and version
      description: The game region, client version and website dataset version, if known.
  - type: textarea
    id: difference
    attributes:
      label: What is wrong
      description: Compare what the site shows with the game. Attach a screenshot or link to the source when possible.
    validations:
      required: true
