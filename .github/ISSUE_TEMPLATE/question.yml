name: Question
description: Ask about using, self-hosting or contributing to ToF Hub.
labels: [question, needs triage]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Explain what you want to understand or achieve.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the relevant page or tool, your setup and anything you have already tried.
