packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  tesseract.js: true
minimumReleaseAgeExclude:
  - tsx@4.23.15

overrides:
  # Security patches; Prisma config uses deepmerge only on plain trusted configuration records.
  '@prisma/config>deepmerge-ts': '8.0.0'
  mysql2: '3.23.1'
  qs: '6.16.0'
  sharp: '0.35.5'
  source-map-js: '1.2.2'
  '@types/react': '19.3.0'
  '@types/react-dom': '19.3.0'
