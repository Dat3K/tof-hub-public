name: ${COMPOSE_PROJECT_NAME:-tof-hub-public}
services:
  setup:
    image: node:24.15.0-alpine
    profiles: [tools]
    working_dir: /workspace
    volumes: [".:/workspace"]
    command: [node, scripts/setup.mjs]

  bootstrap:
    environment:
      TOF_BOOTSTRAP_URL: ${TOF_BOOTSTRAP_URL:-}
    build: {context: ., dockerfile: deploy/tooling.Dockerfile, target: base}
    profiles: [tools]
    working_dir: /workspace
    volumes: [".:/workspace"]
    command: [node, scripts/bootstrap.mjs]

  tooling:
    build: {context: ., dockerfile: deploy/tooling.Dockerfile, target: runner}
    profiles: [tools]
    working_dir: /workspace
    environment:
      TOF_BOOTSTRAP_URL: ${TOF_BOOTSTRAP_URL:-}
      TOF_RAW_GAME_DIR: /raw
      TOF_SITE_INPUTS_DIR: /site-inputs
    volumes:
      - ./apps/web/public:/site-inputs:ro
      - ./scripts/game-processors/curated/datamine/shared/media:/workspace/scripts/game-processors/curated/datamine/shared/media:ro
      - ./scripts/data/media:/workspace/scripts/data/media:ro
      - ./ignore/export:/output
      - ${RAW_GAME_DIR:-./pipeline/raw}:/raw:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tof_hub
      POSTGRES_USER: tof_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setup-required}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tof_owner -d tof_hub]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile, target: migration}
    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL:-}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
    depends_on:
      postgres: {condition: service_healthy}

  provision:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-}
    volumes: ["./deploy:/setup:ro"]
    entrypoint: [sh, /setup/provision.sh]
    depends_on:
      migrate: {condition: service_completed_successfully}

  init-key:
    build: {context: ., dockerfile: apps/api/Dockerfile, target: server}
    volumes: ["api-private-data:/app/.data", "./deploy/init-key.mjs:/setup/init-key.mjs:ro"]
    command: [node, /setup/init-key.mjs]

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lfu, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: apps/api/Dockerfile, target: server}
    environment:
      NODE_ENV: production
      API_PORT: 3001
      WISH_DB_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:-}
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      FEEDBACK_ADMIN_KEY: ${FEEDBACK_ADMIN_KEY:-}
      WISH_IMPORT_KEY_ID: ${WISH_IMPORT_KEY_ID:-self-hosted-1}
      WISH_IMPORT_PRIVATE_KEY_PATH: /app/.data/import-private.pem
      WISH_TRUST_PROXY_HOPS: 1
      GAME_DATA_ROOT: /srv/public/game-data
      WISH_GAME_DATA_DIR: /srv/public/game-data
      REDIS_URL: redis://redis:6379
      TELEGRAM_MODE: ${TELEGRAM_MODE:-off}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      TELEGRAM_RELAY_URL: ${TELEGRAM_RELAY_URL:-}
      TELEGRAM_RELAY_SECRET: ${TELEGRAM_RELAY_SECRET:-}
    volumes: ["api-private-data:/app/.data", "./apps/web/public:/srv/public:ro"]
    depends_on:
      provision: {condition: service_completed_successfully}
      init-key: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: server
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
        NEXT_PUBLIC_CAPTURE_APP_URL: ${NEXT_PUBLIC_CAPTURE_APP_URL:-}
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      GAME_DATA_ROOT: /app/apps/web/public/game-data
      API_INTERNAL_URL: http://api:3001/api/v1
      TOF_HUB_API_ORIGIN: http://api:3001
    volumes: ["./apps/web/public:/app/apps/web/public:ro"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./apps/web/public:/srv/public:ro"]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  api-private-data:
